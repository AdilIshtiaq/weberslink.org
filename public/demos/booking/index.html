<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Booking Demo | WebersLink</title>
<meta name="description" content="Try an online booking system: customers pick a service, a person and a time; the business sees every appointment in one dashboard. A live demo by Weberslink.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#7a4fe0">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/demos/booking/booking.css?v=9">
</head>
<body>
<div class="demobar" role="region" aria-label="About this demo">
  <a class="db-logo" href="/"><img src="/assets/logo.png" alt="WebersLink" width="122" height="22"></a>
  <a class="db-back" href="/demos/">← All demos</a>
  <span class="db-note">Live demo. Bookings stay in your browser.</span>
  <span class="niches" role="group" aria-label="Type of business">
    <button type="button" data-niche="salon">Salon</button>
    <button type="button" data-niche="clinic">Dental clinic</button>
    <button type="button" data-niche="home">Home services</button>
  </span>
  <a class="db-cta" href="/book/new">Create your booking page</a>
</div>

<header class="top">
  <div class="top-in">
    <div class="logo" id="logo" aria-hidden="true"></div>
    <div class="brand"><b id="bizName"></b><span id="bizTag"></span></div>
    <div class="switch" role="group" aria-label="View">
      <button type="button" data-view="book" aria-pressed="true">Book online</button>
      <button type="button" data-view="admin" aria-pressed="false">Business dashboard</button>
    </div>
  </div>
</header>

<main id="main"></main>

<footer class="foot">
  <span id="footNote">Want this for your business? <a href="/book/new">Create your booking page</a> in 5 minutes, or <a href="/book/login">sign in</a>.</span>
  <br><button type="button" class="btn ghost sm" id="resetDemo">Reset demo data</button>
</footer>

<script src="/demos/booking/core.js?v=1"></script>
<script src="/demos/booking/booking.js?v=9"></script>
</body>
</html>
